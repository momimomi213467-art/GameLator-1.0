name: Build GameLator APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Install Android SDK platform 35
        run: |
          yes | sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-35" "build-tools;35.0.0" || true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "SDK dir: $ANDROID_HOME"

      - name: Grant execute permission for gradlew
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "gradlew not found yet - source code not imported"
          fi

      - name: Build Debug APK (when source is ready)
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            echo "Skipping build: Winlator/GameLator source not yet imported into this repository."
            echo "Follow the README instructions to import the source first."
          fi

      - name: Upload APK artifact
        if: success() && hashFiles('app/build/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: GameLator-1.0-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
